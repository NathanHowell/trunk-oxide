\* Background tier without making way: a hunt that decodes every candidate
\* and never closes the ones that had a channel. Expected: WatchFollows is
\* violated (with one channel to spare, the decoder holding it keeps it and
\* the candidate carrying the control channel is never listened to), which
\* is why make_way exists. VoiceServed holds.
SPECIFICATION Spec
CONSTANTS
    MaxChannels = 3
    LocalCands = 2
    WatchCands = 3
    Calls = {1, 2}
    Convs = {1}
    ControlPrio = 0
    VoicePrio = 1
    ConvPrio = 1
    Background = TRUE
    HuntWidth = 3
    HuntDwell = 2
    LostTicks = 2
    MaxMoves = 3
INVARIANTS
    TypeOK
    WithinBudget
    IsPrefix
    WatchNeverBlocks
PROPERTIES
    VoiceServed
    WatchFollows
CHECK_DEADLOCK FALSE
