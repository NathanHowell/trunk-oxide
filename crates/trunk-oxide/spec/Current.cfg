\* The code as of trunk-oxide-86n: control decoders claim at the default
\* control_channel_priority 0, a lost hunt opens every candidate.
\* Expected: VoiceServed is violated (Watch fades out for good, its hunt
\* holds the channels, a granted call waits forever).
\* Add WatchNeverBlocks to INVARIANTS for the shortest counterexample.
SPECIFICATION Spec
CONSTANTS
    MaxChannels = 3
    LocalCands = 2
    WatchCands = 3
    Calls = {1, 2}
    Convs = {1}
    ControlPrio = 0
    VoicePrio = 1
    ConvPrio = 1
    Background = FALSE
    HuntWidth = 3
    HuntDwell = 2
    LostTicks = 2
    MaxMoves = 3
INVARIANTS
    TypeOK
    WithinBudget
    IsPrefix
PROPERTIES
    VoiceServed
CHECK_DEADLOCK FALSE
