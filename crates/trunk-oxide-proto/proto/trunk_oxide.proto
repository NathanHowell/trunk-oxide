syntax = "proto3";
package trunk_oxide;

import "google/protobuf/empty.proto";

// ── Service ──
// trunk-oxide acts as a gRPC SERVER; clients subscribe to streams.

service TrunkOxide {
  // Server-streaming: clients subscribe to receive events
  rpc SubscribeEvents(google.protobuf.Empty) returns (stream PluginEvent);
  // Server-streaming: clients subscribe to receive audio samples
  rpc SubscribeAudio(google.protobuf.Empty) returns (stream AudioSample);
}

// ── Audio ──

message AudioSample {
  int64 talkgroup = 1;
  int32 sys_num = 2;
  double freq = 3;
  bytes samples = 4; // int16 PCM, little-endian
  int32 sample_rate = 5;
}

// ── Events ──

message PluginEvent {
  oneof event {
    SignalEvent signal = 1;
    CallStartEvent call_start = 2;
    CallEndEvent call_end = 3;
    CallsActiveEvent calls_active = 4;
    TrunkMessageEvent trunk_message = 5;
    UnitEvent unit = 6;
    SystemRatesEvent system_rates = 7;
    SetupRecorderEvent setup_recorder = 8;
    SetupSystemEvent setup_system = 9;
    SetupSystemsEvent setup_systems = 10;
    SetupSourcesEvent setup_sources = 11;
    SetupConfigEvent setup_config = 12;
    UnitAliasEvent unit_alias = 13;
  }
}

// ── Signal ──

enum SignalType {
  SIGNAL_TYPE_NORMAL = 0;
  SIGNAL_TYPE_EMERGENCY = 1;
  SIGNAL_TYPE_EMERGENCY_ACK = 2;
  SIGNAL_TYPE_RADIO_CHECK = 3;
  SIGNAL_TYPE_RADIO_CHECK_ACK = 4;
  SIGNAL_TYPE_RADIO_STUN = 5;
  SIGNAL_TYPE_RADIO_STUN_ACK = 6;
  SIGNAL_TYPE_RADIO_REVIVE = 7;
  SIGNAL_TYPE_RADIO_REVIVE_ACK = 8;
  SIGNAL_TYPE_NORMAL_PRE = 9;
  SIGNAL_TYPE_EMERGENCY_PRE = 10;
}

message SignalEvent {
  int64 unit_id = 1;
  string signaling_type = 2;
  SignalType signal_type = 3;
  CallInfo call = 4;
  SystemInfo system = 5;
  RecorderInfo recorder = 6;
}

// ── Call info (live snapshot from Call*) ──

message CallInfo {
  int64 talkgroup = 1;
  int64 call_num = 2;
  int32 sys_num = 3;
  double freq = 4;
  optional double signal = 5;
  optional double noise = 6;
  int32 freq_error = 7;
  bool encrypted = 8;
  bool emergency = 9;
  bool is_analog = 10;
  bool is_conventional = 11;
  bool phase2_tdma = 12;
  int32 tdma_slot = 13;
  int32 priority = 14;
  bool mode = 15;
  bool duplex = 16;
  bool conversation_mode = 17;
  int64 current_source_id = 18;
  double current_length = 19;
  int64 start_time = 20;
  int64 elapsed = 21;
  string short_name = 22;
  reserved 23, 24; // removed: talkgroup_display, talkgroup_tag
  int32 state = 25;
  int32 monitoring_state = 26;
}

// ── System type ──

enum SystemType {
  SYSTEM_TYPE_UNSPECIFIED = 0;
  SYSTEM_TYPE_CONVENTIONAL = 1;
  SYSTEM_TYPE_CONVENTIONAL_P25 = 2;
  SYSTEM_TYPE_CONVENTIONAL_DMR = 3;
  SYSTEM_TYPE_CONVENTIONAL_SIGMF = 4;
  SYSTEM_TYPE_SMARTNET = 5;
  SYSTEM_TYPE_P25 = 6;
}

// ── System info ──

message SystemInfo {
  int32 sys_num = 1;
  uint64 sys_id = 2;
  string short_name = 3;
  SystemType system_type = 4;
  uint64 wacn = 5;
  uint64 nac = 6;
  int32 rfss = 7;
  int32 site_id = 8;
  string bandplan = 9;
  double analog_levels = 10;
  double digital_levels = 11;
  double squelch_db = 12;
  bool conversation_mode = 13;
  int32 message_count = 14;
  int32 decode_rate = 15;
}

// ── Recorder info ──

message RecorderInfo {
  int32 id = 1;
  string type = 2;
  double freq = 3;
  int32 freq_error = 4;
  int64 talkgroup = 5;
  int64 wav_hz = 6;
  bool is_analog = 7;
  bool is_conventional = 8;
  bool is_active = 9;
  bool is_idle = 10;
  double current_length = 11;
}

// ── Source info ──

message SourceInfo {
  int32 src_num = 1;
  double center_freq = 2;
  double rate = 3;
  double min_hz = 4;
  double max_hz = 5;
  string driver = 6;
  string device = 7;
  string antenna = 8;
  double if_gain = 9;
  double lna_gain = 10;
  double pga_gain = 11;
  double vga1_gain = 12;
  double vga2_gain = 13;
  int32 analog_recorders = 14;
  int32 digital_recorders = 15;
  int32 debug_recorders = 16;
  int32 sigmf_recorders = 17;
}

// ── Call data (from call_end, Call_Data_t) ──

message CallData {
  int64 talkgroup = 1;
  uint32 color_code = 2;
  repeated uint64 patched_talkgroups = 3;
  reserved 4, 5, 6, 7, 8; // removed: talkgroup descriptive fields
  int64 call_num = 9;
  double freq = 10;
  int32 freq_error = 11;
  int32 source_num = 12;
  int32 recorder_num = 13;
  optional double signal = 14;
  optional double noise = 15;
  int64 start_time = 16;
  int64 stop_time = 17;
  int64 error_count = 18;
  int64 spike_count = 19;
  bool encrypted = 20;
  bool emergency = 21;
  int32 priority = 22;
  bool mode = 23;
  bool duplex = 24;
  int32 sys_num = 25;
  string short_name = 26;
  string audio_type = 27;
  int32 tdma_slot = 28;
  double length = 29;
  bool phase2_tdma = 30;
  repeated CallSource sources = 31;
  repeated CallError errors = 32;
  repeated Transmission transmissions = 33;
  int32 status = 34;
}

message Transmission {
  int64 source = 1;
  int64 talkgroup = 2;
  uint32 slot = 3;
  uint32 color_code = 4;
  int64 start_time = 5;
  int64 stop_time = 6;
  int64 sample_count = 7;
  int64 spike_count = 8;
  int64 error_count = 9;
  double freq = 10;
  double length = 11;
}

message CallSource {
  int64 source = 1;
  double position = 2;
  bool emergency = 3;
  string signal_system = 4;
  string tag = 5;
}

message CallError {
  double position = 1;
  double total_len = 2;
  double error_count = 3;
  double spike_count = 4;
}

// ── Trunk message ──

enum MessageType {
  MESSAGE_TYPE_GRANT = 0;
  MESSAGE_TYPE_STATUS = 1;
  MESSAGE_TYPE_UPDATE = 2;
  MESSAGE_TYPE_CONTROL_CHANNEL = 3;
  MESSAGE_TYPE_REGISTRATION = 4;
  MESSAGE_TYPE_DEREGISTRATION = 5;
  MESSAGE_TYPE_AFFILIATION = 6;
  MESSAGE_TYPE_SYSID = 7;
  MESSAGE_TYPE_ACKNOWLEDGE = 8;
  MESSAGE_TYPE_LOCATION = 9;
  MESSAGE_TYPE_PATCH_ADD = 10;
  MESSAGE_TYPE_PATCH_DELETE = 11;
  MESSAGE_TYPE_DATA_GRANT = 12;
  MESSAGE_TYPE_UU_ANS_REQ = 13;
  MESSAGE_TYPE_UU_V_GRANT = 14;
  MESSAGE_TYPE_UU_V_UPDATE = 15;
  MESSAGE_TYPE_INVALID_CC_MESSAGE = 16;
  MESSAGE_TYPE_TDULC = 17;
  MESSAGE_TYPE_UNKNOWN = 99;
}

message TrunkMessage {
  MessageType message_type = 1;
  string meta = 2;
  double freq = 3;
  int64 talkgroup = 4;
  bool encrypted = 5;
  bool emergency = 6;
  bool duplex = 7;
  bool mode = 8;
  int32 priority = 9;
  int32 tdma_slot = 10;
  bool phase2_tdma = 11;
  int64 source = 12;
  int32 sys_num = 13;
  uint64 sys_id = 14;
  int32 rfss = 15;
  int32 site_id = 16;
  uint64 nac = 17;
  uint64 wacn = 18;
  PatchData patch_data = 19;
  uint64 opcode = 20;
}

message PatchData {
  uint64 sg = 1;
  uint64 ga1 = 2;
  uint64 ga2 = 3;
  uint64 ga3 = 4;
}

// ── Event wrappers ──

message CallStartEvent {
  CallInfo call = 1;
}

message CallEndEvent {
  CallData call_data = 1;
}

message CallsActiveEvent {
  repeated CallInfo calls = 1;
}

message TrunkMessageEvent {
  repeated TrunkMessage messages = 1;
  SystemInfo system = 2;
}

enum UnitEventType {
  UNIT_EVENT_TYPE_REGISTRATION = 0;
  UNIT_EVENT_TYPE_DEREGISTRATION = 1;
  UNIT_EVENT_TYPE_ACKNOWLEDGE_RESPONSE = 2;
  UNIT_EVENT_TYPE_GROUP_AFFILIATION = 3;
  UNIT_EVENT_TYPE_DATA_GRANT = 4;
  UNIT_EVENT_TYPE_ANSWER_REQUEST = 5;
  UNIT_EVENT_TYPE_LOCATION = 6;
}

message UnitEvent {
  UnitEventType type = 1;
  SystemInfo system = 2;
  int64 source_id = 3;
  int64 talkgroup = 4; // only set for affiliation, answer_request, location
}

message SystemRatesEvent {
  repeated SystemInfo systems = 1;
  float time_diff = 2;
}

message SetupRecorderEvent {
  RecorderInfo recorder = 1;
}

message SetupSystemEvent {
  SystemInfo system = 1;
}

message SetupSystemsEvent {
  repeated SystemInfo systems = 1;
}

message SetupSourcesEvent {
  repeated SourceInfo sources = 1;
}

message SetupConfigEvent {
  repeated SourceInfo sources = 1;
  repeated SystemInfo systems = 2;
}

message UnitAliasEvent {
  SystemInfo system = 1;
  int64 radio_id = 2;
  string alias = 3;
  string source = 4;
  int64 talkgroup_id = 5;
}
