[workspace]
resolver = "3"
members = [
    "crates/trunk-oxide-proto",
    "crates/trunk-oxide-grpc",
    "crates/trunk-oxide",
    "crates/trunk-transcriber-proto",
    "crates/trunk-whisperer",
    "crates/trunk-parakeet",
    "crates/trunk-whistle",
    "crates/trunk-database",
    "crates/trunk-config",
    "crates/trunk-discord",
    "crates/trunk-monitor",
    "crates/trunk-weather",
    "crates/trunk-solver",
    "crates/trunk-uls",
    "crates/trunk-channelizer",
    "crates/trunk-p25",
    "crates/trunk-fm",
    "crates/trunk-rtlsdr-sys",
    "crates/trunk-sdr",
    "crates/trunk-radio",
    "crates/trunk-sh",
]
default-members = [
    "crates/trunk-oxide-proto",
    "crates/trunk-oxide-grpc",
    "crates/trunk-database",
    "crates/trunk-transcriber-proto",
    "crates/trunk-whisperer",
    "crates/trunk-parakeet",
    "crates/trunk-config",
    "crates/trunk-discord",
    "crates/trunk-monitor",
    "crates/trunk-weather",
    "crates/trunk-solver",
    "crates/trunk-uls",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
rust-version = "1.94"
license = "GPL-3.0-or-later"
repository = "https://github.com/NathanHowell/trunk-oxide"

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# Pedantic exceptions — too noisy or subjective
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"

[workspace.dependencies]
proptest = "1.11"
rand = "0.9"
rand_chacha = "0.9"
trunk-oxide = { path = "crates/trunk-oxide" }
trunk-oxide-proto = { path = "crates/trunk-oxide-proto" }
trunk-fm = { path = "crates/trunk-fm" }
trunk-rtlsdr-sys = { path = "crates/trunk-rtlsdr-sys" }
trunk-sdr = { path = "crates/trunk-sdr" }
trunk-radio = { path = "crates/trunk-radio" }
trunk-oxide-grpc = { path = "crates/trunk-oxide-grpc" }
trunk-transcriber-proto = { path = "crates/trunk-transcriber-proto" }
trunk-channelizer = { path = "crates/trunk-channelizer" }
trunk-p25 = { path = "crates/trunk-p25" }
trunk-config = { path = "crates/trunk-config" }
trunk-database = { path = "crates/trunk-database" }
audiopus = "0.2"
audiopus_sys = { version = "0.1", features = ["static"] }
anyhow = "1"
chrono = "0.4"
ogg = "0.9"
image = { version = "0.25", default-features = false, features = ["png"] }
plotters = { version = "0.3", default-features = false, features = ["bitmap_backend", "ab_glyph", "line_series", "chrono"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
opentelemetry = "0.31"
opentelemetry_sdk = { version = "0.31", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.31", default-features = false, features = ["trace", "metrics", "http-proto", "reqwest-blocking-client"] }
prost = "0.14"
prost-types = "0.14"
pkg-config = "0.3"
rustfft = "6"
sonora-ns = "0.2"
num-complex = "0.4"
rubato = "0.16"
serenity = { version = "0.12", default-features = false, features = ["builder", "http", "model", "rustls_backend", "client", "gateway"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time"] }
tokio-stream = "0.1"
tokio-tungstenite = { version = "0.21", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
toml = "0.8"
tower = { version = "0.4", features = ["util"] }
hyper-util = "0.1"
tonic = "0.14"
tonic-health = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tracing = "0.1"
tracing-opentelemetry = "0.32"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
pid1 = "0.1"
whisper-rs = "0.15"
parakeet-rs = { git = "https://github.com/altunenes/parakeet-rs.git", rev = "5a412a9ffa7bf3f3e17f723741e2b8ae63b51655" }
clap = { version = "4", features = ["derive"] }
argfile = "0.2"
wild = "2"
csv = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
rusqlite = { version = "0.34", features = ["bundled"] }
sha2 = "0.10"

[profile.release]
debug = 2

# The healthcheck shell is copied into every distroless image; keep it small.
[profile.release.package.trunk-sh]
opt-level = "z"
debug = 0
strip = true
