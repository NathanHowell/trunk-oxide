services:
  trunk-oxide:
    build:
      context: .
      dockerfile: Dockerfile.trunk-recorder
    devices:
      - /dev/bus/usb:/dev/bus/usb
    volumes:
      - oxide-socket:/var/run/trunk-oxide
      - ./trunk-recorder.conf:/app/config.json:ro
      - ./tests:/test:ro
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318

  fetch-whisper-model:
    image: debian:trixie-slim
    volumes:
      - whisper-models:/models
    command:
      - bash
      - -c
      - |
        set -e
        model=/models/ggml-small.en.bin
        if [ -f "$$model" ]; then
          echo "Model already present"
          exit 0
        fi
        apt-get update -qq && apt-get install -y -qq --no-install-recommends curl ca-certificates
        curl -fSL -o "$$model.tmp" \
          https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small.en.bin
        mv "$$model.tmp" "$$model"

  trunk-whisperer:
    build:
      context: .
      dockerfile: Dockerfile.whisperer
    user: "0:0"
    volumes:
      - whisperer-socket:/var/run/trunk-whisperer
      - ./config-whisperer.toml:/etc/trunk-whisperer/config.toml:ro
      - whisper-models:/models:ro
    depends_on:
      fetch-whisper-model:
        condition: service_completed_successfully
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318

  trunk-discord:
    build:
      context: .
      dockerfile: Dockerfile.discord
    volumes:
      - oxide-socket:/var/run/trunk-oxide:ro
      - whisperer-socket:/var/run/trunk-whisperer:ro
      - ./config-discord.toml:/etc/trunk-discord/config.toml:ro
    depends_on:
      - trunk-oxide
      - trunk-whisperer
    environment:
      - DISCORD_TOKEN
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318

  jaeger:
    image: jaegertracing/all-in-one:1
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"

volumes:
  oxide-socket:
  whisperer-socket:
  whisper-models:
