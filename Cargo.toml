[workspace]
resolver = "3"
members = [
    "crates/trunk-recorder-sys",
    "crates/trunk-recorder-plugin",
    "crates/trunk-oxide-proto",
    "crates/trunk-oxide-grpc",
    "crates/trunk-oxide-driver",
    "crates/trunk-whisperer",
    "crates/trunk-discord",
]
# trunk-oxide-driver enables link-shared on trunk-recorder-sys which conflicts
# with the dlopen plugin build. Exclude it from the default build.
default-members = [
    "crates/trunk-recorder-sys",
    "crates/trunk-recorder-plugin",
    "crates/trunk-oxide-proto",
    "crates/trunk-oxide-grpc",
    "crates/trunk-whisperer",
    "crates/trunk-discord",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# Pedantic exceptions — too noisy or subjective
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"

[workspace.dependencies]
trunk-recorder-sys = { path = "crates/trunk-recorder-sys" }
trunk-recorder-plugin = { path = "crates/trunk-recorder-plugin" }
trunk-oxide-driver = { path = "crates/trunk-oxide-driver" }
trunk-oxide-proto = { path = "crates/trunk-oxide-proto" }
trunk-oxide-grpc = { path = "crates/trunk-oxide-grpc" }
anyhow = "1"
chrono = "0.4"
cxx = "1"
cxx-build = "1"
prost = "0.13"
prost-types = "0.13"
pkg-config = "0.3"
rubato = "0.16"
serenity = { version = "0.12", default-features = false, features = ["builder", "http", "model", "rustls_backend"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros"] }
tokio-stream = "0.1"
toml = "0.8"
tower = "0.4"
hyper-util = "0.1"
tonic = "0.12"
tonic-build = "0.12"
tracing = "0.1"
tracing-subscriber = "0.3"
pid1 = "0.1"
whisper-rs = "0.15"
