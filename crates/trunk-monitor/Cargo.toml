[package]
name = "trunk-monitor"
description = "Keeps a live metrics dashboard (a chart of VictoriaMetrics) up to date in a Discord channel."
edition.workspace = true
version.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
trunk-config.workspace = true
tonic.workspace = true
tonic-health.workspace = true
tokio = { workspace = true, features = ["signal", "time", "net"] }
tokio-stream.workspace = true
serenity.workspace = true
reqwest.workspace = true
plotters.workspace = true
image.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-opentelemetry.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
opentelemetry-otlp.workspace = true
anyhow.workspace = true
pid1.workspace = true
clap.workspace = true
argfile.workspace = true
wild.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros", "rt"] }
