[package]
name = "trunk-whisperer"
version = "0.1.0"
edition = "2024"

[features]
default = []
cuda = ["whisper-rs/cuda"]

[dependencies]
tonic = "0.12"
prost = "0.13"
prost-types = "0.13"
whisper-rs = "0.15"
rubato = "0.16"
serenity = { version = "0.12", default-features = false, features = ["builder", "http", "model", "rustls_backend"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "signal", "time", "net"] }
tokio-stream = { version = "0.1", features = ["net"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1"
chrono = "0.4"

[build-dependencies]
tonic-build = "0.12"
