# The rootless containers run in the user manager's user.slice; terminal
# sessions and their builds run beside it in their own scopes at the
# default weight of 100. The kernel splits a busy CPU between those by
# weight before nice is looked at, so this gives the radio stack ten times
# a session's share when both want the CPU, and costs nothing when idle.
# trunk-oxide refuses to start without it ([oxide] min_cpu_weight).
#
#   install -Dm644 deploy/systemd/user.slice.d/50-trunk-oxide-cpu.conf \
#       ~/.config/systemd/user/user.slice.d/50-trunk-oxide-cpu.conf
#   systemctl --user daemon-reload
#   systemctl --user set-property --runtime user.slice CPUWeight=1000
#
# (a reload does not rewrite a running slice's cgroup; the last line does.)
[Slice]
CPUWeight=1000
