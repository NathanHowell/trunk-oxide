[workspace]
resolver = "3"
members = [
    "crates/trunk-recorder-sys",
    "crates/trunk-recorder-plugin",
    "crates/trunk-oxide-proto",
    "crates/trunk-oxide-grpc",
    "crates/trunk-oxide",
    "crates/trunk-whisperer",
    "crates/trunk-discord",
    "crates/trunk-solver",
]
# trunk-oxide enables link-shared on trunk-recorder-sys which conflicts
# with the dlopen plugin build. Exclude it from the default build.
default-members = [
    "crates/trunk-recorder-sys",
    "crates/trunk-recorder-plugin",
    "crates/trunk-oxide-proto",
    "crates/trunk-oxide-grpc",
    "crates/trunk-whisperer",
    "crates/trunk-discord",
    "crates/trunk-solver",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
rust-version = "1.93"

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# Pedantic exceptions — too noisy or subjective
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"

[workspace.dependencies]
trunk-recorder-sys = { path = "crates/trunk-recorder-sys" }
trunk-recorder-plugin = { path = "crates/trunk-recorder-plugin" }
trunk-oxide = { path = "crates/trunk-oxide" }
trunk-oxide-proto = { path = "crates/trunk-oxide-proto" }
trunk-oxide-grpc = { path = "crates/trunk-oxide-grpc" }
anyhow = "1"
chrono = "0.4"
cxx = "1"
cxx-build = "1"
opentelemetry = "0.31"
opentelemetry_sdk = { version = "0.31", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.31", default-features = false, features = ["trace", "http-proto", "reqwest-blocking-client"] }
prost = "0.14"
prost-types = "0.14"
pkg-config = "0.3"
rubato = "0.16"
serenity = { version = "0.12", default-features = false, features = ["builder", "http", "model", "rustls_backend"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros"] }
tokio-stream = "0.1"
toml = "0.8"
tower = { version = "0.4", features = ["util"] }
hyper-util = "0.1"
tonic = "0.14"
tonic-health = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tracing = "0.1"
tracing-opentelemetry = "0.32"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
pid1 = "0.1"
whisper-rs = "0.15"
clap = { version = "4", features = ["derive"] }
argfile = "0.2"
wild = "2"
z3 = { version = "0.19", features = ["gh-release"] }
csv = "1"
