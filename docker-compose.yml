services:
  trunk-whisperer:
    build:
      context: .
      dockerfile: Dockerfile.whisperer
    user: "0:0"
    volumes:
      - socket:/var/run/trunk-oxide
      - ./config.toml:/etc/trunk-whisperer/config.toml:ro
      - ${WHISPER_MODEL_DIR:-./tests}:/models:ro

  trunk-recorder:
    build:
      context: .
      dockerfile: Dockerfile.trunk-recorder
    volumes:
      - socket:/var/run/trunk-oxide
      - ./trunk-recorder.conf:/app/config.json:ro
      - ./tests:/test:ro
    depends_on:
      - trunk-whisperer

volumes:
  socket:
