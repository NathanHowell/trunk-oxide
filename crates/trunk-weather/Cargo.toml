[package]
name = "trunk-weather"
description = "Streams a Tempest weather station's observations into VictoriaMetrics, to line up with the radio's decode quality."
edition.workspace = true
version.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
tonic.workspace = true
tonic-health.workspace = true
tokio = { workspace = true, features = ["signal", "time", "net"] }
tokio-stream.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
opentelemetry-otlp.workspace = true
anyhow.workspace = true
pid1.workspace = true
clap.workspace = true
argfile.workspace = true
wild.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros", "rt"] }
