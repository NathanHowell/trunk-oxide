services:
  trunk-oxide:
    build:
      context: .
      dockerfile: Dockerfile.trunk-recorder
    restart: unless-stopped
    privileged: true
    group_add:
      - keep-groups
    devices:
      - /dev/rtlsdr0
      - /dev/rtlsdr1
      - /dev/rtlsdr2
      - /dev/rtlsdr3
    volumes:
      - oxide-socket:/run/service
      - oxide-state:/var/lib/trunk-oxide
      # Read by the startup CPU weight check (deploy/systemd/user.slice.d/).
      - /sys/fs/cgroup:/host/sys/fs/cgroup:ro
      - ./config.toml:/app/config.toml:ro
      - ./smco-talkgroups.csv:/app/smco-talkgroups.csv:ro
      - ./svrcs-talkgroups.csv:/app/svrcs-talkgroups.csv:ro
      - ./conventional-channels.csv:/app/conventional-channels.csv:ro
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - OTEL_EXPORTER_OTLP_METRICS_ENDPOINT=http://victoriametrics:8428/opentelemetry/api/v1/push
      - RUST_LOG=info
    healthcheck:
      test: ["CMD", "/usr/local/bin/grpc_health_probe", "-addr", "unix:///run/service/grpc.sock"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 30s

  fetch-whisper-model:
    profiles: ["whisper"]
    image: debian:trixie-slim
    volumes:
      - whisper-models:/models
    command:
      - bash
      - -c
      - |
        set -e
        model=/models/ggml-small.en.bin
        if [ -f "$$model" ]; then
          echo "Model already present"
          exit 0
        fi
        apt-get update -qq && apt-get install -y -qq --no-install-recommends curl ca-certificates
        curl -fSL -o "$$model.tmp" \
          https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small.en.bin
        mv "$$model.tmp" "$$model"

  trunk-whisperer:
    profiles: ["whisper"]
    build:
      context: .
      dockerfile: Dockerfile.whisperer
    user: "0:0"
    volumes:
      - whisperer-socket:/run/service
      - ./config-whisperer.toml:/etc/trunk-whisperer/config.toml:ro
      - whisper-models:/models:ro
    depends_on:
      fetch-whisper-model:
        condition: service_completed_successfully
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - OTEL_EXPORTER_OTLP_METRICS_ENDPOINT=http://victoriametrics:8428/opentelemetry/api/v1/push
      - RUST_LOG=info
    healthcheck:
      test: ["CMD", "/usr/local/bin/grpc_health_probe", "-addr", "unix:///run/service/grpc.sock"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 30s

  # Downloads the Parakeet ONNX export into the parakeet-models volume, mirroring
  # fetch-whisper-model. Defaults to the English TDT 0.6b v2 model, int8 quantized
  # (~630 MB, self-contained — no external .onnx.data). TDT is used (not CTC)
  # because parakeet-rs only detokenizes the TDT path correctly; the CTC export's
  # tokenizer.json has no detokenizer, so tokenizers.decode() space-joins every
  # subword ("m or ning"). The presence of vocab.txt makes trunk-parakeet
  # auto-detect the NeMo TDT format. MODEL_FILES is a space-separated list of
  # repo-relative paths fetched verbatim into /models; override it (and
  # MODEL_REPO) to swap models/precision, e.g. the fp32 set:
  #   encoder-model.onnx encoder-model.onnx.data decoder_joint-model.onnx vocab.txt
  fetch-parakeet-model:
    profiles: ["parakeet"]
    image: debian:trixie-slim
    volumes:
      - parakeet-models:/models
    environment:
      - MODEL_REPO=istupakov/parakeet-tdt-0.6b-v2-onnx
      - MODEL_FILES=encoder-model.int8.onnx decoder_joint-model.int8.onnx vocab.txt
    command:
      - bash
      - -c
      - |
        set -e
        if [ -f /models/vocab.txt ] && [ -f /models/encoder-model.int8.onnx ]; then
          echo "Model already present"
          exit 0
        fi
        apt-get update -qq && apt-get install -y -qq --no-install-recommends curl ca-certificates
        base="https://huggingface.co/$$MODEL_REPO/resolve/main"
        for f in $$MODEL_FILES; do
          echo "downloading $$f"
          curl -fSL --create-dirs -o "/models/$$f.tmp" "$$base/$$f"
          mv "/models/$$f.tmp" "/models/$$f"
        done

  # Drop-in alternative to trunk-whisperer: serves the same Transcriber gRPC
  # service on the same `whisperer-socket`. Enable with `--profile parakeet`
  # and disable trunk-whisperer (only one backend may own the socket at a
  # time). trunk-discord's config is unchanged — it just connects to the
  # socket, backend-agnostic. The model is fetched into the parakeet-models
  # volume by fetch-parakeet-model.
  trunk-parakeet:
    profiles: ["parakeet"]
    build:
      context: .
      dockerfile: Dockerfile.parakeet
    user: "0:0"
    volumes:
      - whisperer-socket:/run/service
      - ./config-parakeet.toml:/etc/trunk-parakeet/config.toml:ro
      - parakeet-models:/models:ro
    depends_on:
      fetch-parakeet-model:
        condition: service_completed_successfully
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - OTEL_EXPORTER_OTLP_METRICS_ENDPOINT=http://victoriametrics:8428/opentelemetry/api/v1/push
      - RUST_LOG=info
    healthcheck:
      test: ["CMD", "/usr/local/bin/grpc_health_probe", "-addr", "unix:///run/service/grpc.sock"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 30s

  # Downloads the Whistle weights (single 16.9 MB .cact file) into the
  # whistle-models volume, mirroring fetch-parakeet-model. MODEL_REV pins the
  # Hugging Face revision of Cactus-Compute/whistle.
  fetch-whistle-model:
    profiles: ["whistle"]
    image: debian:trixie-slim
    volumes:
      - whistle-models:/models
    environment:
      - MODEL_REV=b358ddadd89b7a713b5aa131f23032d3cca1b251
    command:
      - bash
      - -c
      - |
        set -e
        if [ -f /models/whistle.cact ]; then
          echo "Model already present"
          exit 0
        fi
        apt-get update -qq && apt-get install -y -qq --no-install-recommends curl ca-certificates
        curl -fSL -o /models/whistle.cact.tmp "https://huggingface.co/Cactus-Compute/whistle/resolve/$$MODEL_REV/whistle.cact"
        mv /models/whistle.cact.tmp /models/whistle.cact

  # Drop-in alternative to trunk-whisperer / trunk-parakeet: serves the same
  # Transcriber gRPC service on the same `whisperer-socket`. Enable with
  # `--profile whistle` and disable the other transcribers (only one backend
  # may own the socket at a time). trunk-discord's config is unchanged.
  trunk-whistle:
    profiles: ["whistle"]
    build:
      context: .
      dockerfile: Dockerfile.whistle
    user: "0:0"
    volumes:
      - whisperer-socket:/run/service
      - ./config-whistle.toml:/etc/trunk-whistle/config.toml:ro
      - whistle-models:/models:ro
    depends_on:
      fetch-whistle-model:
        condition: service_completed_successfully
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - OTEL_EXPORTER_OTLP_METRICS_ENDPOINT=http://victoriametrics:8428/opentelemetry/api/v1/push
      - RUST_LOG=info
    healthcheck:
      test: ["CMD", "/usr/local/bin/grpc_health_probe", "-addr", "unix:///run/service/grpc.sock"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 30s

  trunk-discord:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile.discord
    user: "0:0"
    volumes:
      - oxide-socket:/run/trunk-oxide
      - whisperer-socket:/run/trunk-whisperer
      - discord-socket:/run/service
      - ./config-discord.toml:/etc/trunk-discord/config.toml:ro
    # No depends_on: discord keeps retrying trunk-oxide's socket and
    # resubscribes whenever the stream drops, so either can be restarted on its
    # own. The transcriber backend is selected by profile (whisper | parakeet |
    # whistle), which a depends_on could not name anyway (podman-compose chokes
    # on a cross-profile one); restart: unless-stopped retries until the active
    # transcriber binds the shared whisperer-socket.
    secrets:
      - discord_token
    command: ["--discord-token", "@/run/secrets/discord_token"]
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - OTEL_EXPORTER_OTLP_METRICS_ENDPOINT=http://victoriametrics:8428/opentelemetry/api/v1/push
      - RUST_LOG=info
    healthcheck:
      test: ["CMD", "/usr/local/bin/grpc_health_probe", "-addr", "unix:///run/service/grpc.sock"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 15s

  # The #monitoring dashboard, apart from trunk-discord: a chart of
  # VictoriaMetrics, edited in place. It reports healthy only while that
  # keeps succeeding, so a dashboard that has gone stale shows here.
  trunk-monitor:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile.monitor
    user: "0:0"
    volumes:
      - monitor-socket:/run/service
      - ./config-monitor.toml:/etc/trunk-monitor/config.toml:ro
    secrets:
      - discord_token
    command: ["--discord-token", "@/run/secrets/discord_token"]
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - OTEL_EXPORTER_OTLP_METRICS_ENDPOINT=http://victoriametrics:8428/opentelemetry/api/v1/push
      - RUST_LOG=info
    healthcheck:
      test: ["CMD", "/usr/local/bin/grpc_health_probe", "-addr", "unix:///run/service/grpc.sock"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 15s

  # Streams the Tempest weather station into VictoriaMetrics, to line rain and
  # temperature up with the radio's decode quality. Reports healthy while
  # observations keep arriving.
  trunk-weather:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile.weather
    user: "0:0"
    volumes:
      - weather-socket:/run/service
    secrets:
      - tempest_token
    command: ["--tempest-token", "@/run/secrets/tempest_token"]
    environment:
      - OTEL_EXPORTER_OTLP_METRICS_ENDPOINT=http://victoriametrics:8428/opentelemetry/api/v1/push
      - RUST_LOG=info
    healthcheck:
      test: ["CMD", "/usr/local/bin/grpc_health_probe", "-addr", "unix:///run/service/grpc.sock"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 15s

  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.15.0
    # Badger storage on a volume (48h TTL) instead of the in-memory default.
    command: ["--config=file:/etc/jaeger/config.yaml"]
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./jaeger-config.yaml:/etc/jaeger/config.yaml:ro
      - jaeger-data:/badger

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.115.0
    command:
      - -storageDataPath=/storage
      - -retentionPeriod=30d
    ports:
      - "8428:8428"
    volumes:
      - victoriametrics-data:/storage

secrets:
  discord_token:
    file: ./secrets/discord_token
  tempest_token:
    file: ./secrets/tempest_token

volumes:
  # trunk-oxide's state across restarts (each dongle's last gain calibration).
  oxide-state:
  oxide-socket:
  whisperer-socket:
  discord-socket:
  weather-socket:
  monitor-socket:
  whisper-models:
  parakeet-models:
  whistle-models:
  victoriametrics-data:
  jaeger-data:
