name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # .cargo/config.toml builds for the host CPU (target-cpu=native), which is
  # right for the scanner but not for a cache shared between runners.
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: ""
  # trunk-whistle needs the prebuilt libneedle.a (NEEDLE_LIB_DIR); it is built
  # only by Dockerfile.whistle.
  EXCLUDE: --exclude trunk-whistle

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends librtlsdr-dev libprotobuf-dev protobuf-compiler libclang-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # clippy::all is denied in the workspace lints, so it fails the job;
      # pedantic and nursery stay warnings.
      - run: cargo clippy --workspace $EXCLUDE --all-targets

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends librtlsdr-dev libprotobuf-dev protobuf-compiler libclang-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace $EXCLUDE

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends librtlsdr-dev libprotobuf-dev protobuf-compiler libclang-dev
      - uses: dtolnay/rust-toolchain@1.94
      - uses: Swatinem/rust-cache@v2
      - run: cargo +1.94 check --workspace $EXCLUDE --all-targets
