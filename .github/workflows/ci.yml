name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # .cargo/config.toml builds for the host CPU (target-cpu=native), which is
  # right for the scanner but not for a cache shared between runners: a
  # proc-macro built on one runner's CPU dies with SIGILL on an older one.
  # An empty value does not override the config, so name a baseline CPU:
  # x86-64-v3 (Haswell on, which every GitHub x86 runner is) has FMA, so
  # mul_add is one instruction rather than a call into libm's fma().
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C target-cpu=x86-64-v3"
  # trunk-whistle needs the prebuilt libneedle.a (NEEDLE_LIB_DIR); it is built
  # only by Dockerfile.whistle.
  EXCLUDE: --exclude trunk-whistle

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    # The Dockerfiles build on trixie; whisper-rs-sys's bindings do not
    # build against Ubuntu 24.04's libclang.
    container: rust:trixie
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y --no-install-recommends librtlsdr-dev libprotobuf-dev protobuf-compiler libclang-dev cmake
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v2-x86-64-v3
      # clippy::all is denied in the workspace lints, so it fails the job;
      # pedantic and nursery stay warnings.
      - run: cargo clippy --workspace $EXCLUDE --all-targets

  test:
    runs-on: ubuntu-latest
    # The Dockerfiles build on trixie; whisper-rs-sys's bindings do not
    # build against Ubuntu 24.04's libclang.
    container: rust:trixie
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y --no-install-recommends librtlsdr-dev libprotobuf-dev protobuf-compiler libclang-dev cmake
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v2-x86-64-v3
      - run: cargo test --workspace $EXCLUDE

  msrv:
    runs-on: ubuntu-latest
    # The Dockerfiles build on trixie; whisper-rs-sys's bindings do not
    # build against Ubuntu 24.04's libclang.
    container: rust:trixie
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y --no-install-recommends librtlsdr-dev libprotobuf-dev protobuf-compiler libclang-dev cmake
      - uses: dtolnay/rust-toolchain@1.100
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v2-x86-64-v3
      - run: cargo +1.100 check --workspace $EXCLUDE --all-targets
