syntax = "proto3";
package trunk_oxide;

import "google/protobuf/duration.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

// ── Service ──
// trunk-oxide acts as a gRPC SERVER; clients subscribe to a unified stream.

service TrunkOxide {
  // Server-streaming: unified stream of audio samples and events.
  // Ordering guarantee: CallEnd always follows the last AudioSample for a call.
  rpc Subscribe(google.protobuf.Empty) returns (stream StreamMessage);
}

// ── Stream ──

message StreamMessage {
  oneof message {
    AudioSample audio = 1;
    PluginEvent event = 2;
  }
}

// ── Audio ──

message AudioSample {
  int64 talkgroup = 1;
  reserved 2; // was sys_num: unstable across restarts, use short_name
  double freq = 3;
  bytes samples = 4; // int16 PCM, little-endian
  int32 sample_rate = 5;
  // Stable system identity: consumers key on this, not on a system number.
  string short_name = 6;
}

// ── Events ──

message PluginEvent {
  reserved 7, 10, 11; // were system_rates, setup_systems, setup_sources: never sent
  oneof event {
    SignalEvent signal = 1;
    CallStartEvent call_start = 2;
    CallEndEvent call_end = 3;
    CallsActiveEvent calls_active = 4;
    TrunkMessageEvent trunk_message = 5;
    UnitEvent unit = 6;
    SetupRecorderEvent setup_recorder = 8;
    SetupSystemEvent setup_system = 9;
    SetupConfigEvent setup_config = 12;
    UnitAliasEvent unit_alias = 13;
  }
}

// ── Signal ──

enum SignalType {
  SIGNAL_TYPE_NORMAL = 0;
  SIGNAL_TYPE_EMERGENCY = 1;
  SIGNAL_TYPE_EMERGENCY_ACK = 2;
  SIGNAL_TYPE_RADIO_CHECK = 3;
  SIGNAL_TYPE_RADIO_CHECK_ACK = 4;
  SIGNAL_TYPE_RADIO_STUN = 5;
  SIGNAL_TYPE_RADIO_STUN_ACK = 6;
  SIGNAL_TYPE_RADIO_REVIVE = 7;
  SIGNAL_TYPE_RADIO_REVIVE_ACK = 8;
  SIGNAL_TYPE_NORMAL_PRE = 9;
  SIGNAL_TYPE_EMERGENCY_PRE = 10;
}

message SignalEvent {
  int64 unit_id = 1;
  reserved 2; // was signaling_type, never filled
  SignalType signal_type = 3;
  CallInfo call = 4;
  reserved 5; // was system, never populated
  reserved 6; // was recorder, never populated
  string unit_alias = 7; // OTA-discovered friendly name, if known
}

// ── Call info (live snapshot from Call*) ──

message CallInfo {
  int64 talkgroup = 1;
  int64 call_num = 2;
  reserved 3; // was sys_num: unstable across restarts, use short_name
  double freq = 4;
  optional double signal = 5;
  optional double noise = 6;
  reserved 7; // was freq_error, never filled
  bool encrypted = 8;
  bool emergency = 9;
  reserved 10; // was is_analog: see kind
  bool is_conventional = 11;
  bool phase2_tdma = 12;
  int32 tdma_slot = 13;
  int32 priority = 14;
  bool mode = 15;
  bool duplex = 16;
  bool conversation_mode = 17;
  optional int64 current_source_id = 18; // the unit talking, if known
  reserved 19; // was current_length, replaced by elapsed
  google.protobuf.Timestamp start_time = 20;
  google.protobuf.Duration elapsed = 21;
  string short_name = 22;
  string talkgroup_alpha_tag = 23; // e.g. "SMC SO Pat 1"
  string talkgroup_tag = 24;       // e.g. "Law Dispatch"
  CallState call_state = 25;
  string talkgroup_group = 26;     // e.g. "County Sheriff"
  // W3C traceparent of the recorder-side call span (set only on CallStart;
  // empty in CallsActive/Signal). Lets the consumer parent the work it does for
  // this call to the recorder's trace — the EventBridge is one server stream
  // multiplexing all calls, so per-call context can't ride gRPC metadata and
  // travels here.
  string traceparent = 27;
  // The kind of channel the call has: "p25", "analog" (empty while it has
  // none).
  string kind = 28;
}

// ── Call state ──

enum CallState {
  CALL_STATE_UNSPECIFIED = 0;
  CALL_STATE_RECORDING = 1;
  CALL_STATE_IDLE = 2;
  CALL_STATE_WAITING = 3; // wants a channel; all are held by calls that outrank it
  CALL_STATE_REJECTED_UNKNOWN_TG = 10;
  CALL_STATE_REJECTED_IGNORED_TG = 11;
  CALL_STATE_REJECTED_NO_SOURCE = 12;
  CALL_STATE_REJECTED_NO_CHANNEL = 13; // no channel could be opened for it
  CALL_STATE_REJECTED_ENCRYPTED = 14;
  CALL_STATE_REJECTED_DUPLICATE = 15;
  CALL_STATE_REJECTED_SUPERSEDED = 16;
}

// ── System type ──

enum SystemType {
  SYSTEM_TYPE_UNSPECIFIED = 0;
  SYSTEM_TYPE_CONVENTIONAL = 1;
  SYSTEM_TYPE_CONVENTIONAL_P25 = 2;
  SYSTEM_TYPE_CONVENTIONAL_DMR = 3;
  SYSTEM_TYPE_CONVENTIONAL_SIGMF = 4;
  SYSTEM_TYPE_SMARTNET = 5;
  SYSTEM_TYPE_P25 = 6;
}

// ── System info ──

message SystemInfo {
  reserved 1; // was sys_num: unstable across restarts, use short_name
  uint64 sys_id = 2;
  string short_name = 3;
  SystemType system_type = 4;
  uint64 wacn = 5;
  uint64 nac = 6;
  int32 rfss = 7;
  int32 site_id = 8;
  string bandplan = 9;
  double analog_levels = 10;
  double digital_levels = 11;
  double squelch_db = 12;
  bool conversation_mode = 13;
  reserved 14, 15; // were message_count, decode_rate, never filled
}

// ── Recorder info ──

// A channel (a channelizer slot the radio has used).
message RecorderInfo {
  int32 id = 1; // the channel number
  reserved 2;  // was type
  reserved 3;  // was freq, now known in Rust CallEntry
  int32 freq_error = 4; // the FLL's error (Hz) when the channel last closed
  reserved 5;  // was talkgroup, now known in Rust CallEntry
  reserved 6;  // was wav_hz, now cached in Rust AudioMeta
  reserved 7;  // was is_analog, now known in Rust CallEntry
  reserved 8;  // was is_conventional, now known in Rust CallEntry
  reserved 9;  // was is_active, now known in Rust CallEntry
  reserved 10; // was is_idle, now known in Rust CallEntry
  reserved 11; // was current_length, now computed in Rust
}

// ── Call data (at call end) ──

message CallData {
  int64 talkgroup = 1;
  reserved 2; // was color_code, never filled
  repeated uint64 patched_talkgroups = 3;
  reserved 4, 5, 6, 7, 8; // removed: talkgroup descriptive fields
  int64 call_num = 9;
  double freq = 10;
  int32 freq_error = 11;
  reserved 12; // was source_num, never filled
  optional uint32 channel = 13; // the channel it ended on, if it had one
  optional double signal = 14;
  optional double noise = 15;
  int64 start_time = 16;
  int64 stop_time = 17;
  int64 error_count = 18;
  int64 spike_count = 19;
  bool encrypted = 20;
  bool emergency = 21;
  int32 priority = 22;
  bool mode = 23;
  bool duplex = 24;
  reserved 25; // was sys_num: unstable across restarts, use short_name
  string short_name = 26;
  reserved 27; // was audio_type: see kind and phase2_tdma
  int32 tdma_slot = 28;
  double length = 29;
  bool phase2_tdma = 30;
  reserved 31, 32, 34; // were sources, errors, status, never filled
  repeated Transmission transmissions = 33;
  repeated CallSegment segments = 35;
  bool is_conventional = 36;
  string kind = 37; // as CallInfo.kind
}

message Transmission {
  reserved 1, 3, 4; // were source, slot, color_code, never filled
  int64 talkgroup = 2;
  int64 start_time = 5;
  int64 stop_time = 6;
  int64 sample_count = 7;
  int64 spike_count = 8;
  int64 error_count = 9;
  double freq = 10;
  reserved 11; // was length, now computed in Rust
}

message CallSegment {
  double freq = 1;
  google.protobuf.Timestamp start_time = 2;
  google.protobuf.Duration duration = 3;
  optional uint32 channel = 4; // the channel it was recorded on, if any
}

// ── Trunk message ──

enum MessageType {
  MESSAGE_TYPE_GRANT = 0;
  MESSAGE_TYPE_STATUS = 1;
  MESSAGE_TYPE_UPDATE = 2;
  MESSAGE_TYPE_CONTROL_CHANNEL = 3;
  MESSAGE_TYPE_REGISTRATION = 4;
  MESSAGE_TYPE_DEREGISTRATION = 5;
  MESSAGE_TYPE_AFFILIATION = 6;
  MESSAGE_TYPE_SYSID = 7;
  MESSAGE_TYPE_ACKNOWLEDGE = 8;
  MESSAGE_TYPE_LOCATION = 9;
  MESSAGE_TYPE_PATCH_ADD = 10;
  MESSAGE_TYPE_PATCH_DELETE = 11;
  MESSAGE_TYPE_DATA_GRANT = 12;
  MESSAGE_TYPE_UU_ANS_REQ = 13;
  MESSAGE_TYPE_UU_V_GRANT = 14;
  MESSAGE_TYPE_UU_V_UPDATE = 15;
  MESSAGE_TYPE_INVALID_CC_MESSAGE = 16;
  MESSAGE_TYPE_TDULC = 17;
  MESSAGE_TYPE_UNKNOWN = 99;
}

message TrunkMessage {
  MessageType message_type = 1;
  string meta = 2;
  double freq = 3;
  int64 talkgroup = 4;
  bool encrypted = 5;
  bool emergency = 6;
  bool duplex = 7;
  bool mode = 8;
  int32 priority = 9;
  int32 tdma_slot = 10;
  bool phase2_tdma = 11;
  int64 source = 12;
  reserved 13; // was sys_num: unstable across restarts, use short_name
  uint64 sys_id = 14;
  int32 rfss = 15;
  int32 site_id = 16;
  uint64 nac = 17;
  uint64 wacn = 18;
  PatchData patch_data = 19;
  uint64 opcode = 20;
}

message PatchData {
  uint64 sg = 1;
  uint64 ga1 = 2;
  uint64 ga2 = 3;
  uint64 ga3 = 4;
}

// ── Event wrappers ──

message CallStartEvent {
  CallInfo call = 1;
}

message CallEndEvent {
  CallData call_data = 1;
  CallEndReason reason = 2;
}

// Why a call (or one transmission of it) ended.
enum CallEndReason {
  CALL_END_REASON_UNSPECIFIED = 0;
  CALL_END_REASON_GRANT_TIMEOUT = 1;      // the control channel stopped refreshing it
  CALL_END_REASON_IDLE_TIMEOUT = 2;       // it aged out without recording
  CALL_END_REASON_SUPERSEDED = 3;         // another site's grant superseded it
  CALL_END_REASON_WRITE_TIMEOUT = 4;      // its channel stopped producing audio
  CALL_END_REASON_CONVENTIONAL = 5;       // a conventional transmission ended
  CALL_END_REASON_SOURCE_CHANGE = 6;      // another unit is talking (the call goes on)
  CALL_END_REASON_KEY_UP = 7;             // a new key-up was granted (the call goes on)
  CALL_END_REASON_CHANNEL_REASSIGNED = 8; // its channel was granted to another talkgroup
  CALL_END_REASON_EVICTED = 9;            // a call that outranks it took its channel
  CALL_END_REASON_SHUTDOWN = 10;
}

message CallsActiveEvent {
  repeated CallInfo calls = 1;
}

message TrunkMessageEvent {
  repeated TrunkMessage messages = 1;
  SystemInfo system = 2;
}

enum UnitEventType {
  UNIT_EVENT_TYPE_REGISTRATION = 0;
  UNIT_EVENT_TYPE_DEREGISTRATION = 1;
  UNIT_EVENT_TYPE_ACKNOWLEDGE_RESPONSE = 2;
  UNIT_EVENT_TYPE_GROUP_AFFILIATION = 3;
  UNIT_EVENT_TYPE_DATA_GRANT = 4;
  UNIT_EVENT_TYPE_ANSWER_REQUEST = 5;
  UNIT_EVENT_TYPE_LOCATION = 6;
}

message UnitEvent {
  UnitEventType type = 1;
  SystemInfo system = 2;
  int64 source_id = 3;
  int64 talkgroup = 4; // only set for affiliation, answer_request, location
  string source_alias = 5; // OTA-discovered friendly name, if known
}

message SetupRecorderEvent {
  RecorderInfo recorder = 1;
}

message SetupSystemEvent {
  SystemInfo system = 1;
}

message SetupConfigEvent {
  reserved 1; // was sources, never populated
  repeated SystemInfo systems = 2;
}

message UnitAliasEvent {
  reserved 1; // was system, never populated
  int64 radio_id = 2;
  string alias = 3;
  string source = 4;
  int64 talkgroup_id = 5;
}
